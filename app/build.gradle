plugins {
    id 'com.android.application'
}

// O identificador do app e definido no formulario "Run workflow" do GitHub.
// Identificadores diferentes geram aplicativos que coexistem no mesmo Quest.
def shortcutId = System.getenv('QUEST_SHORTCUT_ID') ?: 'internet'
if (!(shortcutId ==~ /[a-z][a-z0-9_]{0,39}/)) {
    throw new GradleException('Identificador invalido. Use letras minusculas, numeros e _, comecando com letra.')
}

android {
    namespace 'br.edu.es.belmiro.internetbtp'
    compileSdk 35

    defaultConfig {
        applicationId "br.edu.es.belmiro.atalho.${shortcutId}"
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
